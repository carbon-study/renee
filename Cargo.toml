[workspace]
members = [
  "crates/renee-conformance",
  "crates/renee-gatewayd",
  "crates/renee-model",
  "crates/renee-sessiond",
  "crates/renee-subject",
  "crates/renee-stored",
  "crates/renee-supervisord",
  "crates/renee-types",
  "crates/renee-wire",
]
resolver = "3"

[workspace.package]
authors = ["Carbon contributors"]
edition = "2024"
homepage = "https://github.com/carbon-study/renee"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/carbon-study/renee"
rust-version = "1.85"
version = "0.0.0"

[workspace.dependencies]
tokio = { version = "1.53.0", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
wtransport = "0.6.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
