[workspace]
members = [
  "crates/renee-conformance",
  "crates/renee-model",
  "crates/renee-store",
  "crates/renee-types",
]
resolver = "3"

[workspace.package]
authors = ["Carbon contributors"]
edition = "2024"
homepage = "https://github.com/carbon-study/renee"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/carbon-study/renee"
rust-version = "1.85"
version = "0.0.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
